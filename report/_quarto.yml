# Project site in the quarto-hi package-docs look. Build with `make report` from the
# repository root (sets REPORT_OUT / REPORT_PROJECT); R/prepare.R gathers the outputs first.
project:
  type: website
  output-dir: _site
  render: ["*.qmd"]   # not the pipeline summary in data/
  pre-render: Rscript R/prepare.R
  resources:
    # Referenced from CSS (mask-image), which Quarto does not scan
    - styles/hi-watermark.css
    - img/hi/hi_logo.svg

lang: en

website:
  title: "lowpoly-pdf-to-svg"
  description: "Convert low poly papercraft PDF templates into Inkscape and Cricut-ready SVGs."
  site-url: https://tungufoss.github.io/lowpoly-pdf-to-svg/
  repo-url: https://github.com/tungufoss/lowpoly-pdf-to-svg
  repo-subdir: report
  repo-actions: [edit, issue]
  favicon: img/hi/favicon.svg
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: img/hi/hi_named_logo-en.svg
    logo-alt: "University of Iceland"
    background: primary
    left:
      - text: Home
        href: index.qmd
      - text: Get started
        href: install.qmd
      - text: Guide
        href: usage.qmd
      - text: Cricut
        href: cricut.qmd
      - text: Method
        href: method.qmd
      - text: Results
        href: sheets.qmd
      - text: Reference
        href: reference.qmd
    right:
      - icon: github
        href: https://github.com/tungufoss/lowpoly-pdf-to-svg
        aria-label: Source on GitHub
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - index.qmd
      - section: "Getting started"
        contents:
          - install.qmd
          - quickstart.qmd
      - section: "Guide"
        contents:
          - usage.qmd
      - section: "Method"
        contents:
          - method.qmd
      - section: "Results"
        contents:
          - sheets.qmd
          - glue-pairs.qmd
          - fold3d.qmd
      - section: "Research"
        contents:
          - benchmark.qmd
          - wip.qmd
      - section: "Reference"
        contents:
          - reference.qmd
          - export-contract.qmd
  page-footer:
    left: 'Bowser papercraft by [Sweets The Cat](https://sweetsthecat.itch.io/), free for personal use'
    right:
      - text: "quarto-hi"
        href: https://github.com/HI-IDN/quarto-hi

format:
  html:
    theme:
      - cosmo
      - styles/hi-site.scss
    css: styles/hi-watermark.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  echo: false
  warning: false
  message: false
